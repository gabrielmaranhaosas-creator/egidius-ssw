name: Validar EGIDIUS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: egidius-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API e preservacao dos dados
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: egidius_ci
          POSTGRES_PASSWORD: somente-teste-isolado
          POSTGRES_DB: egidius_ci
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U egidius_ci -d egidius_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      EGIDIUS_DATABASE_URL: sqlite:////tmp/egidius-ci.sqlite3
      EGIDIUS_MEDIA_DIR: /tmp/egidius-ci-media
      EGIDIUS_LOCAL_ACCESS: "true"
      EGIDIUS_SECURE_COOKIES: "false"
      EGIDIUS_TEST_POSTGRES_URL: postgresql+psycopg://egidius_ci:somente-teste-isolado@127.0.0.1:15432/egidius_ci
      EGIDIUS_TEST_S3_ENDPOINT: http://127.0.0.1:19000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - name: Instalar dependencias verificadas
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - name: Iniciar armazenamento S3 isolado para testes
        run: |
          docker run --detach --name egidius-s3-ci --publish 127.0.0.1:19000:5000 motoserver/moto:5.2.3
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:19000/
      - name: Testar API, importacoes, backup e restauracao
        run: python -m pytest backend/tests -q
      - name: Conferir primeira carga privada para Oracle
        run: python -m unittest discover -s deploy/oracle/tests -v
      - name: Encerrar armazenamento do teste
        if: always()
        run: docker rm --force egidius-s3-ci 2>/dev/null || true

  frontend:
    name: Interface e compilacao
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker:
    name: Imagem e inicializacao de producao
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Construir imagem
        run: docker build --tag egidius-ci:teste .
      - name: Validar Compose e proxy Oracle sem dados reais
        run: |
          mkdir -p /tmp/egidius-oci-ci/private
          touch /tmp/egidius-oci-ci/private/app.env
          EGIDIUS_ROOT=/tmp/egidius-oci-ci EGIDIUS_DOMAIN=ssw.exemplo.org docker compose -f deploy/oracle/compose.yaml config --quiet
          docker run --rm -e EGIDIUS_DOMAIN=ssw.exemplo.org -v "$PWD/deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Iniciar imagem com banco temporario de teste
        run: >-
          docker run --detach --name egidius-ci
          --publish 127.0.0.1:18080:8080
          --env EGIDIUS_DATABASE_URL=sqlite:////tmp/egidius-ci.sqlite3
          egidius-ci:teste
      - name: Conferir API e interface compilada
        run: |
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-connrefused --retry-delay 1 --max-time 3 http://127.0.0.1:18080/api/health
          curl --fail --silent --show-error http://127.0.0.1:18080/ > /tmp/egidius-ci-index.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path('/tmp/egidius-ci-index.html').read_text()
          assert 'id="root"' in page
          assert '/assets/' in page
          print('Interface compilada respondendo na imagem Docker.')
          PY
      - name: Exibir logs em caso de falha
        if: failure()
        run: docker logs egidius-ci 2>/dev/null || true
      - name: Encerrar apenas o container do teste
        if: always()
        run: docker rm --force egidius-ci 2>/dev/null || true
